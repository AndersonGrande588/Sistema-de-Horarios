<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex" />
    <meta name="googlebot" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Horarios por Tienda</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <header>
        <h1>📋 Gestor de Horarios por Tienda</h1>
        <p>Filtra por país, ciudad y tienda para ver el calendario del personal</p>
    </header>

    <div id="allGuardsPanel" class="guards-panel hidden">
        <div class="guards-head">
            <h3>🧾 Lista de guardias del mes</h3>
            <div class="guards-head-tools">
                <div class="guards-head-filters">
                    <select id="guardsMonthSelect" onchange="selectGuardsFilters()"></select>
                    <select id="guardsCountrySelect" onchange="guardsCountryChanged()"></select>
                    <select id="guardsCitySelect" onchange="selectGuardsFilters()"></select>
                </div>
                <button class="guards-btn guards-close-btn" onclick="closeGuards()">✖ Cerrar</button>
            </div>
        </div>
        <div id="allGuardsList"></div>
    </div>

    <div class="filter-bar">
        <div class="filter-field">
            <label for="countrySelect">🌍 País</label>
            <select id="countrySelect" onchange="filterStoresByCountry()">
                <option value="">-- Elegir --</option>
                <option value="colombia">🇨🇴 Colombia</option>
                <option value="mexico">🇲🇽 México</option>
                <option value="argentina">🇦🇷 Argentina</option>
                <option value="chile">🇨🇱 Chile</option>
                <option value="peru">🇵🇪 Perú</option>
                <option value="ecuador">🇪🇨 Ecuador</option>
                <option value="panama">🇵🇦 Panamá</option>
            </select>
        </div>

        <div class="filter-field">
            <label for="citySelect">🏙️ Ciudad</label>
            <select id="citySelect" onchange="filterStoresByCity()" disabled>
                <option value="">-- Elegir --</option>
            </select>
        </div>

        <div class="filter-field">
            <label for="storeSelect">🏪 Tienda</label>
            <select id="storeSelect" onchange="renderStore()" disabled>
                <option value="">-- Elegir --</option>
            </select>
        </div>

        <div class="filter-field filter-action">
            <label>&nbsp;</label>
            <button class="guards-btn city-guards-btn hidden" id="btnCityGuards" onclick="showCityGuards()">🛡️ Guardias de esta ciudad</button>
        </div>
    </div>

    <div id="storeInfo" class="hidden">
        <div class="store-banner">
            <div>
                <h2 id="storeName"></h2>
                <p id="storeAddress"></p>
                <div class="country-indicator" id="countryDisplay"></div>
            </div>
            <div class="badge">
                <span id="staffCount">0</span> empleados asignados
            </div>
        </div>
    </div>

    <div id="staffSection" class="hidden" style="margin-top: 20px;">
        <div class="section-header">
            <h3>👥 Calendario Mensual</h3>
        </div>

        <div class="filter-row" id="dateFilters">
            <div class="filter-group">
                <label>📅 Mes</label>
                <select id="monthSelect" onchange="selectMonth()"></select>
            </div>
        </div>

        <div id="staffList"></div>
    </div>

    <div id="emptyState" class="empty-state">
        <div class="icon">🏪</div>
        <p>Selecciona un país, una ciudad y una tienda para ver el personal y sus horarios</p>
    </div>
</div>

<script src="funciones.js"></script>

</body>
</html>
